
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Monitoring | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Tahoma, sans-serif;
            background: #0b1220;
            color: #ffffff;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #151f30;
            border: 1px solid #26364c;
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0,0,0,.35);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #60a5fa;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 13px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 15px;
            direction: ltr;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            color: #f87171;
        }
    </style>
    <link rel="icon" href="/static/favicon.ico" sizes="any">

</head>

<body>

<div class="login-container">

    <h2>PRODUCTION MONITORING</h2>

    <div class="subtitle">
        Production Management System
    </div>

    <form id="loginForm">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            autofocus
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">
            Log In
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

let loginInProgress = false;

async function login() {

    if (loginInProgress) return;

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");

    if (!username || !password) {
        message.textContent = "Enter your username and password.";
        return;
    }

    loginInProgress = true;
    sessionStorage.clear();

    button.disabled = true;
    button.textContent = "Signing in...";
    message.textContent = "";

    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })

        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.detail || "Incorrect username or password."
            );
        }

        sessionStorage.setItem("workflow_username", result.username || username);

        // ADMIN
        if (result.role === "admin") {

            sessionStorage.setItem(
                "attendance_admin_username",
                result.username || username
            );

            window.location.href = "/admin";

        }

        // DASHBOARD
        else if (result.role === "dashboard") {

            const adminUsername =
                result.username || username;

            // Store dashboard session
            sessionStorage.setItem(
                "admin_username",
                adminUsername
            );

            // Compatibility with admin attendance pages
            sessionStorage.setItem(
                "attendance_admin_username",
                adminUsername
            );

            window.location.href = "/dashboard";

        }

        // ORDER CODE
        else if (result.role === "ordercode") {

            window.location.href = "/ordercode";

        }

        // SUPERVISOR
        else if (result.role === "supervisor") {

            window.location.href =
                "/supervisor/" +
                result.line_id +
                "?username=" +
                encodeURIComponent(username);

        }

        // OPERATOR
        else if (result.role === "operator") {

            window.location.href =
                "/line/" +
                result.line_id;

        }

        else if (result.role === "technician") {
            window.location.href = "/repair";
        }

        else if (result.role === "qc") {
            window.location.href = "/qc";
        }

        else {

            throw new Error(
                "Invalid user role: " + result.role
            );

        }

    }

    catch (error) {

        console.error("LOGIN ERROR:", error);

        message.textContent = error.message;

        button.disabled = false;
        button.textContent = "Log In";
        loginInProgress = false;

    }

}

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();
        login();

    });

document
    .querySelectorAll("#loginForm input")
    .forEach(function(input) {
        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                login();
            }
        });
    });

</script>

</body>
</html>
