<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assembly - Line {{ line_id }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            color: #0f172a;
        }

        .header {
            height: 70px;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .line {
            font-size: 18px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .scan-box {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #serialInput {
            width: 100%;
            height: 65px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 25px;
            outline: none;
        }

        #serialInput:focus {
            border-color: #2563eb;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 20px;
        }

        .label {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
        }

        .status {
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            background: #e2e8f0;
            color: #475569;
        }

        .status.ok {
            background: #dcfce7;
            color: #166534;
        }

        .status.repair {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .waiting {
            margin-top: 15px;
            text-align: center;
            color: #64748b;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .stat {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .stat-title {
            color: #64748b;
            font-size: 14px;
        }

        .stat-value {
            margin-top: 8px;
            font-size: 30px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .history-box {
            margin-top: 25px;
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .history-title {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0f172a;
            color: white;
            padding: 13px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status-ok {
            color: #166534;
            font-weight: bold;
        }

        .status-repair {
            color: #991b1b;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">

    <h1>ASSEMBLY</h1>

    <div class="line">
        LINE {{ line_id }}
    </div>

</div>


<div class="container">

    <div class="scan-box">

        <div class="title">
            Scan Serial Number
        </div>

        <input
            id="serialInput"
            type="text"
            autocomplete="off"
            autofocus
            placeholder="Scan serial..."
        >


        <div class="info">

            <div class="info-box">

                <div class="label">
                    Order Number
                </div>

                <div
                    id="orderNumber"
                    class="value"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    Product Type
                </div>

                <div
                    id="productType"
                    class="value"
                >
                    -
                </div>

            </div>

        </div>


        <div
            id="statusBox"
            class="status"
        >
            WAITING FOR SERIAL
        </div>

        <div
            id="waitingText"
            class="waiting"
        >
            Scan a serial number
        </div>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                OK
            </div>

            <div
                id="okCount"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                IN REPAIR
            </div>

            <div
                id="repairCount"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                EXPECTED
            </div>

            <div
                id="expectedCount"
                class="stat-value"
            >
                0
            </div>

        </div>

        <div class="history-box">

            <div class="history-title">
                Assembly History
            </div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Time</th>
                            <th>Serial Number</th>
                            <th>Order Number</th>
                            <th>Product Type</th>
                            <th>Status</th>
                            <th>Repair Reason</th>
                        </tr>

                    </thead>

                    <tbody id="historyBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const lineId = {{ line_id }};

const serialInput = document.getElementById("serialInput");

const orderNumber = document.getElementById("orderNumber");

const productType = document.getElementById("productType");

const statusBox = document.getElementById("statusBox");

const waitingText = document.getElementById("waitingText");

let currentSerial = null;
let currentOrderNumber = null;
let currentProductType = null;
let waitingForStatus = false;


/*
    Scan Serial
*/

serialInput.addEventListener("keydown", async function(event) {

    if (event.key !== "Enter") {
        return;
    }

    event.preventDefault();

    const value = serialInput.value.trim();

    if (!value) {
        return;
    }


    /*
        اگر منتظر Status هستیم
    */

    if (waitingForStatus) {

        await scanStatus(value);

        serialInput.value = "";

        return;
    }


    /*
        در غیر این صورت Serial است
    */

    await scanSerial(value);

});


async function scanSerial(serial) {

    statusBox.className = "status";
    statusBox.innerText = "CHECKING...";

    waitingText.innerText = "";

    try {

        const response = await fetch("/api/assembly/scan", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                line_id: lineId,
                serial_number: serial
            })

        });


        const data = await response.json();


        // -----------------------------
        // Error
        // -----------------------------

        if (data.error) {

            statusBox.className = "status error";

            statusBox.innerText = data.error;

            waitingText.innerText =
                "Scan another serial number";

            clearCurrent();

            serialInput.select();

            return;
        }


        // -----------------------------
        // Save Current Product
        // -----------------------------

        currentSerial = data.serial_number;

        currentOrderNumber = data.order_number;

        currentProductType = data.product_type;


        orderNumber.innerText = currentOrderNumber;

        productType.innerText = currentProductType;


        // -----------------------------
        // New Product
        // -----------------------------

        if (!data.current_status) {

            statusBox.className = "status";

            statusBox.innerText =
                "WAITING FOR STATUS";

            waitingText.innerText =
                "Scan SETALLPOSITIVE or CANCELCHECKIN";

        }


        // -----------------------------
        // Existing Product - OK
        // -----------------------------

        else if (data.current_status === "OK") {

            statusBox.className = "status ok";

            statusBox.innerText =
                "CURRENT STATUS: OK";

            waitingText.innerText =
                "Scan SETALLPOSITIVE or CANCELCHECKIN";

        }


        // -----------------------------
        // Existing Product - REPAIR
        // -----------------------------

        else if (data.current_status === "REPAIR") {

            statusBox.className = "status repair";

            statusBox.innerText =
                "CURRENT STATUS: IN REPAIR";

            if (data.repair_reason) {

                waitingText.innerText =
                    "Repair Reason: " + data.repair_reason;

            } else {

                waitingText.innerText =
                    "Scan SETALLPOSITIVE to return from repair";

            }

        }


        // -----------------------------
        // Ready for Status Scan
        // -----------------------------

        waitingForStatus = true;

        serialInput.value = "";

    }

    catch (error) {

        console.error(error);

        statusBox.className = "status error";

        statusBox.innerText =
            "SERVER ERROR";

        waitingText.innerText =
            "Please try again";

    }

}


/*
    Clear current product
*/

function clearCurrent() {

    currentSerial = null;

    currentOrderNumber = null;

    currentProductType = null;

    orderNumber.innerText = "-";

    productType.innerText = "-";

}


/*
    Keep scanner focused
*/

document.addEventListener("click", function() {

    serialInput.focus();

});

async function scanStatus(statusBarcode) {

    if (!waitingForStatus || !currentSerial) {
        return;
    }

    let status = null;

    if (statusBarcode.toLowerCase() === "setallpositive") {
        status = "OK";
    }

    if (statusBarcode.toLowerCase() === "cancelcheckin") {
        status = "REPAIR";
    }

    if (!status) {
        statusBox.className = "status error";
        statusBox.innerText = "INVALID STATUS";

        waitingText.innerText =
            "Scan SETALLPOSITIVE or CANCELCHECKIN";

        return;
    }


    /*
        REPAIR
    */

    if (status === "REPAIR") {

        const reason = prompt("Enter Repair Reason:");

        if (!reason || !reason.trim()) {

            statusBox.className = "status error";

            statusBox.innerText =
                "REPAIR REASON REQUIRED";

            return;
        }

        await saveAssemblyStatus(
            "REPAIR",
            reason.trim()
        );

        return;
    }


    /*
        OK
    */

    await saveAssemblyStatus(
        "OK",
        null
    );
}

async function saveAssemblyStatus(status, repairReason) {

    try {

        const response = await fetch(
            "/api/assembly/status",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    line_id: lineId,
                    serial_number: currentSerial,
                    status: status,
                    repair_reason: repairReason
                })
            }
        );


        const data = await response.json();


        if (data.error) {

            statusBox.className = "status error";

            statusBox.innerText = data.error;

            waitingText.innerText = "";

            return;
        }


        /*
            موفق
        */

        if (status === "OK") {

            statusBox.className = "status ok";

            statusBox.innerText = "OK";

        } else {

            statusBox.className = "status repair";

            statusBox.innerText = "IN REPAIR";

        }


        waitingText.innerText =
            "Scan next serial number";


        waitingForStatus = false;

        loadAssemblyHistory();

        currentSerial = null;

        currentOrderNumber = null;

        currentProductType = null;


        orderNumber.innerText = "-";

        productType.innerText = "-";


        /*
            آماده اسکن بعدی
        */

        setTimeout(() => {

            statusBox.className = "status";

            statusBox.innerText =
                "WAITING FOR SERIAL";

            serialInput.value = "";

            serialInput.focus();

        }, 1200);

    }

    catch (error) {

        console.error(error);

        statusBox.className = "status error";

        statusBox.innerText = "SERVER ERROR";

    }
}

async function loadAssemblyHistory() {

    try {

        const response = await fetch(
            `/api/assembly/history/${lineId}`
        );

        const data = await response.json();

        const body = document.getElementById(
            "historyBody"
        );

        body.innerHTML = "";

        data.forEach(item => {

            const row = document.createElement("tr");

            const statusClass =
                item.status === "OK"
                    ? "status-ok"
                    : "status-repair";

            row.innerHTML = `
                <td>${item.time}</td>

                <td>${item.serial_number}</td>

                <td>${item.order_number}</td>

                <td>${item.product_type || "-"}</td>

                <td class="${statusClass}">
                    ${item.status}
                </td>

                <td>
                    ${item.repair_reason || "-"}
                </td>
            `;

            body.appendChild(row);

        });

    }

    catch (error) {

        console.error(
            "Assembly history error:",
            error
        );

    }
}
loadAssemblyHistory();

setInterval(
    loadAssemblyHistory,
    5000
);
</script>


</body>
</html>
