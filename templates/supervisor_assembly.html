<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Today Assembly</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: #0f172a;

    color: white;

    font-family: Arial, sans-serif;
}

.header {

    padding: 20px 30px;

    background: #111827;

    border-bottom: 1px solid #334155;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.header h1 {

    margin: 0;

    font-size: 28px;
}

.header span {

    color: #94a3b8;

    font-size: 18px;
}

.container {

    padding: 25px;
}

.back {

    display: inline-block;

    margin-bottom: 20px;

    padding: 10px 18px;

    background: #334155;

    color: white;

    text-decoration: none;

    border-radius: 8px;
}

.back:hover {

    background: #475569;
}

.table-box {

    background: #111827;

    border-radius: 12px;

    overflow: auto;

    border: 1px solid #334155;
}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 1000px;
}

thead {

    background: #1e293b;
}

th {

    padding: 15px;

    text-align: center;

    color: #cbd5e1;

    font-size: 14px;

    border-bottom: 1px solid #334155;
}

td {

    padding: 13px;

    text-align: center;

    border-bottom: 1px solid #1e293b;

    font-size: 14px;
}

tbody tr:hover {

    background: #172033;
}

.product-aio {

    color: #38bdf8;

    font-weight: bold;
}

.product-mnt {

    color: #a78bfa;

    font-weight: bold;
}

.product-case {

    color: #fbbf24;

    font-weight: bold;
}

.product-nb {

    color: #22c55e;

    font-weight: bold;
}

.empty {

    text-align: center;

    padding: 40px;

    color: #64748b;
}

</style>

    <link rel="icon" href="/static/favicon.ico" sizes="any">

</head>


<body>


<dive class="header">
        <h1 >
            Today Assembly
        </h1>
        <span>
            Line {{ line_id}}
        </span>
</dive>

<div class="container">


    <a
        href="/supervisor/{{ line_id }}"
        class="back"
    >
        ← Back to Supervisor
    </a>



    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Time</th>

                    <th>Serial Number</th>

                    <th>Order Number</th>

                    <th>Product Type</th>

                    <th>Status</th>

                    <th>Repair Reason</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="assemblyBody">

            </tbody>

        </table>

    </div>


</div>


<script>

const lineId = {{ line_id }};


async function loadAssembly() {

    try {

        const response = await fetch(
            `/api/supervisor/assembly/today/${lineId}`
        );

        const data = await response.json();

        const body =
            document.getElementById("assemblyBody");

        body.innerHTML = "";


        if (!data.length) {

            body.innerHTML = `
                <tr>
                    <td
                        colspan="8"
                        class="empty"
                    >
                        No Assembly Records Today
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(item => {

            const row =
                document.createElement("tr");


            const statusClass =
                item.status === "OK"
                    ? "ok"
                    : "repair";


            row.innerHTML = `

                <td>
                    ${item.id}
                </td>

                <td>
                    ${item.time}
                </td>

                <td>
                    ${item.serial_number}
                </td>

                <td>
                    ${item.order_number}
                </td>

                <td>
                    ${item.product_type || "-"}
                </td>

                <td class="${statusClass}">
                    ${item.status}
                </td>

                <td>
                    ${item.repair_reason || "-"}
                </td>

                <td>

                    <button
                        class="edit"
                        onclick="
                            editAssembly(
                                ${item.id},
                                '${item.serial_number}',
                                '${item.order_number}',
                                '${item.product_type || ""}',
                                '${item.status}',
                                '${item.repair_reason || ""}'
                            )
                        "
                    >
                        Edit
                    </button>


                    <button
                        class="delete"
                        onclick="
                            deleteAssembly(
                                ${item.id}
                            )
                        "
                    >
                        Delete
                    </button>

                </td>

            `;


            body.appendChild(row);

        });

    }

    catch (error) {

        console.error(
            "Today Assembly Error:",
            error
        );

    }

}


loadAssembly();


setInterval(
    loadAssembly,
    5000
);


/*
    EDIT
*/

function editAssembly(
    id,
    serial,
    orderNumber,
    productType,
    status,
    repairReason
) {

    const newSerial =
        prompt(
            "Serial Number:",
            serial
        );

    if (newSerial === null) {
        return;
    }


    const newOrder =
        prompt(
            "Order Number:",
            orderNumber
        );

    if (newOrder === null) {
        return;
    }


    const newStatus =
        prompt(
            "Status (OK / REPAIR):",
            status
        );

    if (newStatus === null) {
        return;
    }


    let newReason = repairReason;


    if (
        newStatus.toUpperCase() ===
        "REPAIR"
    ) {

        newReason =
            prompt(
                "Repair Reason:",
                repairReason
            );

        if (newReason === null) {
            return;
        }

    }


    updateAssembly(
        id,
        newSerial,
        newOrder,
        newStatus,
        newReason
    );

}


/*
    DELETE
*/

async function deleteAssembly(id) {

    const confirmDelete =
        confirm(
            "Delete this Assembly record?"
        );

    if (!confirmDelete) {
        return;
    }


    try {

        const response = await fetch(
            `/api/supervisor/assembly/${id}`,
            {
                method: "DELETE"
            }
        );


        const data =
            await response.json();


        if (data.error) {

            alert(data.error);

            return;

        }


        loadAssembly();

    }

    catch (error) {

        console.error(error);

        alert(
            "Server Error"
        );

    }

}


/*
    UPDATE
*/

async function updateAssembly(
    id,
    serial,
    orderNumber,
    status,
    repairReason
) {

    try {

        const response = await fetch(
            `/api/supervisor/assembly/${id}`,
            {

                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    serial_number: serial,

                    order_number:
                        orderNumber,

                    status:
                        status.toUpperCase(),

                    repair_reason:
                        repairReason

                })

            }
        );


        const data =
            await response.json();


        if (data.error) {

            alert(data.error);

            return;

        }


        loadAssembly();

    }

    catch (error) {

        console.error(error);

        alert(
            "Server Error"
        );

    }

}

async function editAssembly(
    id,
    currentSerial,
    currentStatus,
    currentReason
) {

    const serialNumber = prompt(
        "Enter Serial Number:",
        currentSerial
    );

    if (serialNumber === null) {
        return;
    }


    const status = prompt(
        "Enter Status: OK or REPAIR",
        currentStatus
    );

    if (status === null) {
        return;
    }


    let repairReason = null;


    if (status.trim().toUpperCase() === "REPAIR") {

        repairReason = prompt(
            "Enter Repair Reason:",
            currentReason
        );

        if (repairReason === null) {
            return;
        }

    }


    const response = await fetch(
        `/api/supervisor/assembly/${id}`,
        {
            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                line_id: lineId,

                serial_number: serialNumber,

                status: status,

                repair_reason: repairReason

            })
        }
    );


    const result = await response.json();


    if (result.error) {

        alert(result.error);

        return;
    }


    alert(
        "Assembly Updated Successfully"
    );


    loadAssembly();

}



async function deleteAssembly(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this Assembly record?"
    );


    if (!confirmDelete) {
        return;
    }


    const response = await fetch(
        `/api/supervisor/assembly/${id}`,
        {
            method: "DELETE"
        }
    );


    const result = await response.json();


    if (result.error) {

        alert(result.error);

        return;
    }


    alert(
        "Assembly Deleted Successfully"
    );


    loadAssembly();

}

</script>


</body>

</html>
