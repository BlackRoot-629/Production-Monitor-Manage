<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<title>Order Code Management</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#0f172a;

    font-family:Tahoma;

    color:white;

    padding:20px;

}

.container{

    width:700px;

    background:linear-gradient(
        145deg,
        #2c2c2c,
        #1a1a1a
    );

    padding:40px;

    border-radius:30px;

    box-shadow:
        0 15px 30px rgba(0,0,0,.6);

}

h1{

    text-align:center;

    margin-bottom:30px;

}

h2{

    text-align:center;

    margin-top:35px;

}

input,
select{

    width:100%;

    box-sizing:border-box;

    padding:15px;

    margin-bottom:20px;

    border:none;

    border-radius:10px;

    font-size:20px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    font-size:20px;

    cursor:pointer;

}

#message{

    text-align:center;

    margin-top:20px;

    font-size:22px;

    font-weight:bold;

}

.success{

    color:#22c55e;

}

.error{

    color:#ef4444;

}

table{

    width:100%;

    margin-top:20px;

    border-collapse:collapse;

}

th,
td{

    border:1px solid #475569;

    padding:12px;

    text-align:center;

}

th{

    background:#334155;

}

</style>

    <link rel="icon" href="/static/favicon.ico" sizes="any">

</head>

<body>

<div class="container">

    <h1>

        Order Code Management

    </h1>

    <input
        id="orderCode"
        placeholder="Order Code"
    >

    <input
        id="targetQuantity"
        type="number"
        min="1"
        step="1"
        placeholder="Target packed quantity"
        required
    >

    <select id="productType">

        <option value="AIO">
            AIO
        </option>

        <option value="MNT">
            MNT
        </option>

        <option value="CASE">
            CASE
        </option>

        <option value="NB">
            NB
        </option>

    </select>

    <button onclick="saveOrderCode()">

        Save

    </button>

    <div id="message"></div>

    <h2>

        Order Codes

    </h2>

    <table>

        <thead>

            <tr>

                <th>
                    Order Code
                </th>

                <th>
                    Product Type
                </th>

                <th>Target Quantity</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody id="historyTable">

        </tbody>

    </table>

</div>

<script>

function responseError(payload, status) {
    const detail = payload?.detail;
    if (Array.isArray(detail)) {
        return detail.map(item => item.msg || item.message || JSON.stringify(item)).join("; ");
    }
    if (detail && typeof detail === "object") return detail.message || JSON.stringify(detail);
    return detail || payload?.error || `Request failed (${status})`;
}

async function readApiResponse(response) {
    const raw = await response.text();
    let result;
    try {
        result = JSON.parse(raw);
    } catch {
        throw new Error(`Server returned HTTP ${response.status}: ${raw.slice(0, 240) || "empty response"}`);
    }
    if (!response.ok) throw new Error(responseError(result, response.status));
    return result;
}

async function loadHistory(){

    try {
    const response =

        await fetch(
            "/api/ordercodes"
        );

    const data = await readApiResponse(response);
    if (!Array.isArray(data)) throw new Error(data.error || "Could not load order codes.");

    let html = "";

    data.forEach(item=>{

        html += `

        <tr>

            <td>

                ${item.order_code}

            </td>

            <td>

                ${item.product_type}

            </td>

            <td>
                <input id="target-${item.order_code}" type="number" min="1" step="1" value="${item.target_quantity || 0}" style="width:130px;margin:0;padding:8px;font-size:16px">
            </td>

            <td>
                <button onclick="updateTarget('${item.order_code}')" style="padding:8px 12px;font-size:15px">Save Target</button>
            </td>

        </tr>

        `;

    });

    document.getElementById(
        "historyTable"
    ).innerHTML = html;

    } catch (error) {
        const message = document.getElementById("message");
        message.className = "error";
        message.innerText = error.message || "Could not load order codes.";
    }

}

async function saveOrderCode(){

    const orderCode =
        document.getElementById(
            "orderCode"
        ).value.trim();

    const productType =
        document.getElementById(
            "productType"
        ).value;

    const targetQuantity = Number(
        document.getElementById("targetQuantity").value
    );

    if (!orderCode || !Number.isInteger(targetQuantity) || targetQuantity < 1) {
        const message = document.getElementById("message");
        message.className = "error";
        message.innerText = "Enter an order code and a target quantity of at least 1.";
        return;
    }

    try {
    const response =
        await fetch(

            "/api/ordercode",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },

                body:JSON.stringify({

                    order_code:
                        orderCode,

                    product_type:
                        productType,

                    target_quantity:
                        targetQuantity

                })

            }

        );

    const result = await readApiResponse(response);

    const message =
        document.getElementById(
            "message"
        );

    if(result.message){

        message.className =
            "success";

        message.innerText =
            "✓ Saved";

        document.getElementById(
            "orderCode"
        ).value = "";

        document.getElementById("targetQuantity").value = "";

        loadHistory();

    }

    else{

        message.className =
            "error";

        message.innerText =
            result.error || "Could not save order code.";

    }
    } catch (error) {
        const message = document.getElementById("message");
        message.className = "error";
        message.innerText = error.message || "Could not save order code.";
    }

}

async function updateTarget(orderCode) {
    const quantity = Number(document.getElementById(`target-${orderCode}`).value);
    const message = document.getElementById("message");
    if (!Number.isInteger(quantity) || quantity < 1) {
        message.className = "error";
        message.innerText = "Target quantity must be at least 1.";
        return;
    }
    try {
        const response = await fetch(`/api/ordercode/${encodeURIComponent(orderCode)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ target_quantity: quantity })
        });
        const result = await readApiResponse(response);
        if (!response.ok || !result.success) throw new Error(result.detail || result.error || "Could not update target.");
        message.className = "success";
        message.innerText = `Target quantity for ${orderCode} updated.`;
        await loadHistory();
    } catch (error) {
        message.className = "error";
        message.innerText = error.message;
    }
}

loadHistory();

</script>

</body>

</html>
