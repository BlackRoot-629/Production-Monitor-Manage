<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Assembly Monitor</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<style>

body {

    font-family: Tahoma;

    background: #0f172a;

    color: white;

    margin: 20px;

    transition: background .5s;

}

h1 {

    text-align: center;

    font-size: 60px;

    margin-bottom: 20px;

}

#breakAlert {
    display: none;
    margin: 8px 0 14px;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(135deg,#eab308,#ca8a04);
    color: #111827;
    text-align: center;
    font-size: clamp(36px,5vw,64px);
    font-weight: 900;
    letter-spacing: 1px;
    box-shadow: 0 0 28px rgba(234,179,8,.45);
}
#breakAlert.active { display: block; }

#exitQueueAlert {
    display: none;
    margin: 8px 0 14px;
    padding: 14px 20px;
    border: 2px solid #f59e0b;
    border-radius: 14px;
    background: linear-gradient(135deg,#fef3c7,#fbbf24);
    color: #422006;
    text-align: center;
    font-size: clamp(24px,3vw,42px);
    font-weight: 900;
    box-shadow: 0 0 28px rgba(245,158,11,.4);
}
#exitQueueAlert.active { display: block; }
#exitQueueCounts {
    display: flex;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 6px;
    font-size: clamp(18px,2vw,28px);
}

.row {

    display: flex;

    gap: 20px;

    margin-bottom: 20px;

}

.card {

    flex: 1;

    background: linear-gradient(
        145deg,
        #2c2c2c,
        #1a1a1a
    );

    border-radius: 25px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 8px 20px rgba(0,0,0,.6);

}

.value {

    font-size: 70px;

    font-weight: bold;

}

.title {

    font-size: 24px;

    margin-bottom: 10px;

    opacity: .8;

}

.big {

    height: 170px;

}

#differenceCard {

    transition: .5s;

}

.monitor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1px;
    width: 100%;
}

.monitor-header h1 {
    margin-bottom: 8px;
}

#productName {

    padding: 12px 35px;

    background: linear-gradient(
        145deg,
        #1e40af,
        #1d4ed8
    );

    border: 1px solid rgba(96, 165, 250, 0.6);

    border-radius: 15px;

    color: white;

    font-size: 30px;
    font-weight: bold;

    box-shadow:
        0 6px 20px rgba(30, 64, 175, 0.35);
}

</style>

    <link rel="icon" href="/static/favicon.ico" sizes="any">

</head>


<body>


<div class="monitor-header">

    <h1>
        Assembly - Line {{ line_id }}
    </h1>

    <div id="productName">
        Product: -
    </div>

</div>

<div id="breakAlert" aria-live="assertive"></div>
<div id="exitQueueAlert" role="status" aria-live="polite">
    QC APPROVED — WAITING FOR RETURN TO ASSEMBLY
    <div id="exitQueueCounts">
        <span id="lineExitQueueCount">\Product to return: 0</span>
    </div>
</div>
<div class="row">

    <div class="card">

        <div class="title">
            AIO
        </div>

        <div
            class="value"
            id="aio"
        >
            0
        </div>

    </div>


    <div class="card">

        <div class="title">
            MNT
        </div>

        <div
            class="value"
            id="mnt"
        >
            0
        </div>

    </div>


    <div class="card">

        <div class="title">
            CASE
        </div>

        <div
            class="value"
            id="case"
        >
            0
        </div>

    </div>


    <div class="card">

        <div class="title">
            NB
        </div>

        <div
            class="value"
            id="nb"
        >
            0
        </div>

    </div>

</div>


<div class="row">


    <div class="card">

        <div class="title">
            OK
        </div>

        <div
            class="value"
            id="ok"
        >
            0
        </div>

    </div>


    <div class="card">

        <div class="title">
            IN REPAIR
        </div>

        <div
            class="value"
            id="repair"
        >
            0
        </div>

    </div>


</div>


<div class="row">


    <div class="card big">

            <div class="title">
                Actual Assembly
            </div>

            <div
                class="value"
                id="actual"
            >
                0
            </div>

        </div>

        <div class="card big">

            <div class="title">
                AIO Actual
            </div>

            <div
                class="value"
                id="aioEquivalent"
            >
                0
            </div>

        </div>


        <div class="card big">

            <div class="title">
                Target
            </div>

            <div
                class="value"
                id="expected"
            >
                0
            </div>

        </div>

    </div>

    </div>


</div>


<div class="row">


    <div
        class="card big"
        id="differenceCard"
    >

        <div class="title">
            Difference
        </div>

        <div
            class="value"
            id="difference"
        >
            0
        </div>

    </div>


</div>


<div class="row">


    <div class="card">

        <div class="title">
            Stop(MIN)
        </div>

        <div
            class="value"
            id="stop"
        >
            0
        </div>

    </div>


    <div class="card">

        <div class="title">
            Switch
        </div>

        <div
            class="value"
            id="switch"
        >
            0
        </div>

    </div>


</div>


<script>


async function loadData() {

    const response = await fetch(
        "/api/assembly/monitor/{{ line_id }}"
    );


    const data = await response.json();

    document.getElementById("productName").innerText =
        data.product_name
            ? "PRODUCT: " + data.product_name
            : "PRODUCT: -";

    updateBreakAlert(data.tea_time, data.lunch_time);


    document.getElementById("ok").innerText =
        data.ok;


    document.getElementById("repair").innerText =
        data.repair;


    document.getElementById("actual").innerText =
        data.actual_count;


    document.getElementById("expected").innerText =
        data.expected_count;


    document.getElementById("difference").innerText =
        data.difference;


    document.getElementById("stop").innerText =
        data.stop_minutes;


    document.getElementById("switch").innerText =
        data.switch_count;

    document.getElementById("aioEquivalent").innerText =
        data.aio_equivalent;

    document.getElementById("aio").innerText =
        data.aio;

    document.getElementById("mnt").innerText =
        data.mnt;

    document.getElementById("case").innerText =
        data.case;

    document.getElementById("nb").innerText =
        data.nb;


    const diffCard =
        document.getElementById(
            "differenceCard"
        );


    if (data.difference > 0) {

        diffCard.style.background =
            "linear-gradient(145deg,#16a34a,#15803d)";

    }

    else if (data.difference < 0) {

        diffCard.style.background =
            "linear-gradient(145deg,#dc2626,#991b1b)";

    }

    else {

        diffCard.style.background =
            "linear-gradient(145deg,#2563eb,#1d4ed8)";

    }


    const actual =
        document.getElementById("actual");


    if (
        data.actual_count >=
        data.expected_count
    ) {

        actual.style.color =
            "#00ff00";

    }

    else {

        actual.style.color =
            "#ffffff";

    }

}

function isInBreakWindow(startTime, durationMinutes) {
    if (!startTime || !/^\d{2}:\d{2}$/.test(startTime)) return false;
    const [hour, minute] = startTime.split(":").map(Number);
    const start = hour * 60 + minute;
    const now = new Date();
    const current = now.getHours() * 60 + now.getMinutes();
    return (current - start + 1440) % 1440 < durationMinutes;
}

function updateBreakAlert(teaTime, lunchTime) {
    const alert = document.getElementById("breakAlert");
    if (isInBreakWindow(lunchTime, 45)) {
        alert.textContent = "🍽 LUNCH TIME 🍽";
        alert.classList.add("active");
    } else if (isInBreakWindow(teaTime, 15)) {
        alert.textContent = "☕ TEA TIME ☕";
        alert.classList.add("active");
    } else {
        alert.textContent = "";
        alert.classList.remove("active");
    }
}

async function loadExitQueueCount() {
    try {
        const response = await fetch(
            "/api/assembly/exit-queue/{{ line_id }}",
            { cache: "no-store" }
        );
        if (!response.ok) return;
        const data = await response.json();
        const count = Number(data.line_count || 0);
        document.getElementById("lineExitQueueCount").innerText =
            `This line: ${count}`;
        document.getElementById("exitQueueAlert").classList.toggle("active", count > 0);
    } catch (error) {
        console.error("Exit queue count error:", error);
    }
}


loadData();
loadExitQueueCount();


setInterval(
    loadData,
    5000
);

setInterval(loadExitQueueCount, 3000);


</script>


</body>

</html>
